[build]
  publish = "."
  functions = "netlify/functions"


# Chat routes — order matters (admin before wildcard)
[[redirects]]
  from = "/chat/admin"
  to = "/chat/admin.html"
  status = 200
  force = false

[[redirects]]
  from = "/chat/admin/"
  to = "/chat/admin.html"
  status = 200
  force = false

# Chat room — any /chat/<id> serves the room page
[[redirects]]
  from = "/chat/:id"
  to = "/chat/room.html"
  status = 200
  force = false

# Old myspeech link — file was renamed to index.html
[[redirects]]
  from = "/sites/myspeech/myspeech.html"
  to = "/sites/myspeech/"
  status = 301
  force = true

# SPA-style fallback for sites
[[redirects]]
  from = "/sites/*"
  to = "/sites/index.html"
  status = 200
  force = false
