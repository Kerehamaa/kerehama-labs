[build]
  publish = "."
  functions = "netlify/functions"


# The repo is purely the CMS now — homepage goes straight to it
[[redirects]]
  from = "/"
  to = "/cms/"
  status = 302
  force = true

# CMS API — short paths for functions (beacon + publish endpoints)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Old myspeech link — file was renamed to index.html
[[redirects]]
  from = "/sites/myspeech/myspeech.html"
  to = "/sites/myspeech/"
  status = 301
  force = true
