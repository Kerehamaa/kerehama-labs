<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kerehama Labs — client site preview">
  <title>Preview — Kerehama Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0D0E10;
      --bg-soft: #141617;
      --fg: #FFFFFF;
      --muted: #A9ACAF;
      --accent: #06b6d4;
      --accent-soft: rgba(6, 182, 212, 0.12);
      --card-border: rgba(255, 255, 255, 0.08);
      --bar-h: 3.5rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    .toolbar {
      flex: 0 0 auto;
      min-height: var(--bar-h);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem 1rem;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--fg);
      white-space: nowrap;
    }
    .brand .labs {
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 600;
    }
    .brand .site-name {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .spacer { flex: 1; }

    .group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 0.25rem;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.9rem;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
      text-decoration: none;
    }
    .tool-btn:hover { color: var(--fg); }
    .tool-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .tool-btn svg { width: 15px; height: 15px; flex: 0 0 auto; }

    .tool-btn.icon-only { padding: 0.4rem 0.55rem; }

    .dims {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      min-width: 5.5rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ── Workspace ── */
    .workspace {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(6,182,212,0.06), transparent 60%),
        var(--bg);
      padding: 1rem;
    }

    .frame-shell {
      position: relative;
      background: #000;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), height 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.35s ease;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .frame-shell.device {
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
    }
    .frame-shell.full {
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    .frame-shell iframe {
      border: none;
      background: #fff;
      display: block;
      transform-origin: top left;
    }

    /* ── Error card ── */
    .error-card {
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      padding: 2rem;
    }
    .error-card h1 { font-size: 1.4rem; font-weight: 600; }
    .error-card p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    .error-card a {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.6rem 1.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .error-card a:hover { background: var(--accent); color: #050505; }

    @media (max-width: 720px) {
      .toolbar { gap: 0.5rem; }
      .dims { display: none; }
      .brand .site-name { display: none; }
      .tool-btn { font-size: 0.72rem; padding: 0.35rem 0.7rem; }
      .tool-btn .label { display: none; }
      .tool-btn { gap: 0; }
      .workspace { padding: 0.5rem; }
    }
  </style>
</head>
<body>
  <header class="toolbar" id="toolbar">
    <a class="brand" href="/sites/" title="Back to Kerehama Labs">
      <span class="labs">Labs</span>
      <span class="site-name" id="site-name">Preview</span>
    </a>

    <div class="spacer"></div>

    <div class="group" id="device-group">
      <button class="tool-btn" data-device="mobile" title="Phone preview (390×844)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18.5" x2="13" y2="18.5"/></svg>
        <span class="label">Mobile</span>
      </button>
      <button class="tool-btn" data-device="tablet" title="Tablet preview (820×1180)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="11" y1="18.5" x2="13" y2="18.5"/></svg>
        <span class="label">Tablet</span>
      </button>
      <button class="tool-btn" data-device="laptop" title="Laptop preview (1280×800)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><line x1="1" y1="20" x2="23" y2="20"/></svg>
        <span class="label">Laptop</span>
      </button>
      <button class="tool-btn" data-device="full" title="Fill this window">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <span class="label">Full</span>
      </button>
    </div>

    <div class="group">
      <button class="tool-btn icon-only" id="rotate-btn" title="Rotate device">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="tool-btn icon-only" id="reload-btn" title="Reload site">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <a class="tool-btn" id="open-btn" href="#" target="_blank" rel="noopener" title="Open the site on its own in a new tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span class="label">Open</span>
      </a>
    </div>

    <span class="dims" id="dims"></span>
  </header>

  <main class="workspace" id="workspace">
    <div class="frame-shell full" id="frame-shell" hidden>
      <iframe id="site-frame" title="Site preview"></iframe>
    </div>
    <div class="error-card" id="error-card" hidden>
      <h1>Site not found</h1>
      <p id="error-text">That demo doesn't exist (yet). Check the name and try again from the Labs portal.</p>
      <a href="/sites/">← Back to Labs</a>
    </div>
  </main>

  <script>
    const SITES = {
      'bop-speech-therapy':   'Bay of Plenty Speech Therapy',
      'buff-hair-beauty':     'Buff Hair & Beauty',
      'california-car-valet': 'California Car Valet',
      'crop-hair-design':     'CROP Hair Design',
      'example':              'Example Demo',
      'faded-barbershop':     'FADED Barbershop',
      'frontier-strong':      'Frontier Strong',
      'graced-opp-shop':      'Graced Opp Shop & Espresso Bar',
      'henrys-handyman':      "Henry's Handyman",
      'imperial-barbers':     'Imperial Barbers',
      'kaimai-cafe':          'Kaimai Cafe',
      'ks-beauty':            "K's Beauty",
      'myspeech':             'MySpeech',
      'new-hong-kong':        'New Hong Kong Takeaways',
      'yoga-for-every-body':  'Yoga for Every Body'
    };

    const DEVICES = {
      mobile: { w: 390,  h: 844  },
      tablet: { w: 820,  h: 1180 },
      laptop: { w: 1280, h: 800  },
      full:   null
    };

    const params = new URLSearchParams(location.search);
    const slug = (params.get('site') || '').trim().toLowerCase().replace(/[^a-z0-9\-]/g, '');

    const shell     = document.getElementById('frame-shell');
    const frame     = document.getElementById('site-frame');
    const workspace = document.getElementById('workspace');
    const dims      = document.getElementById('dims');
    const rotateBtn = document.getElementById('rotate-btn');
    const deviceBtns = [...document.querySelectorAll('#device-group .tool-btn')];

    let device = 'full';
    let rotated = false;

    if (!SITES[slug]) {
      document.getElementById('error-card').hidden = false;
      if (slug) {
        document.getElementById('error-text').textContent =
          'No demo called "' + slug + '" here. Check the name and try again from the Labs portal.';
      }
      document.getElementById('toolbar').querySelectorAll('.group, .dims').forEach(el => el.style.display = 'none');
    } else {
      const siteUrl = '/sites/' + slug + '/';
      document.getElementById('site-name').textContent = SITES[slug];
      document.title = SITES[slug] + ' — Preview';
      document.getElementById('open-btn').href = siteUrl;
      frame.src = siteUrl;
      shell.hidden = false;
      setDevice('full');
    }

    function setDevice(name) {
      device = name;
      deviceBtns.forEach(b => b.classList.toggle('active', b.dataset.device === name));
      rotateBtn.style.opacity = name === 'full' ? 0.3 : 1;
      layout();
    }

    function layout() {
      const spec = DEVICES[device];
      if (!spec) {
        // Fill the workspace edge-to-edge
        shell.className = 'frame-shell full';
        const pad = 0;
        workspace.style.padding = pad + 'px';
        shell.style.width = '100%';
        shell.style.height = '100%';
        frame.style.width = '100%';
        frame.style.height = '100%';
        frame.style.transform = 'none';
        dims.textContent = 'Fit window';
        return;
      }
      workspace.style.padding = '';
      shell.className = 'frame-shell device';
      const w = rotated ? spec.h : spec.w;
      const h = rotated ? spec.w : spec.h;

      // Scale down to fit the workspace if the device is bigger than the window
      const avail = workspace.getBoundingClientRect();
      const scale = Math.min(1, (avail.width - 32) / w, (avail.height - 32) / h);

      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
      frame.style.transform = 'scale(' + scale + ')';
      shell.style.width = Math.round(w * scale) + 'px';
      shell.style.height = Math.round(h * scale) + 'px';
      dims.textContent = w + ' × ' + h + (scale < 1 ? ' · ' + Math.round(scale * 100) + '%' : '');
    }

    deviceBtns.forEach(b => b.addEventListener('click', () => setDevice(b.dataset.device)));

    rotateBtn.addEventListener('click', () => {
      if (device === 'full') return;
      rotated = !rotated;
      layout();
    });

    document.getElementById('reload-btn').addEventListener('click', () => {
      frame.src = frame.src;
    });

    window.addEventListener('resize', layout);
  </script>
</body>
</html>
