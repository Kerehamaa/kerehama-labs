<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor — Kitset</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cms/cms.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/cms/cms.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  .editor-wrap { display: flex; flex-direction: column; height: 100vh; }
  .stage { flex: 1; background: #dfe7f2; display: flex; justify-content: center; overflow: auto; position: relative; }
  .stage iframe { border: none; background: #fff; width: 100%; height: 100%; }
  .stage.mobile { padding: 18px 0; }
  .stage.mobile iframe {
    width: 390px; height: calc(100% - 0px); margin: 0 auto;
    border-radius: 18px; box-shadow: var(--shadow-lg); border: 1px solid var(--line-strong);
  }
  #save-state { font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
  #save-state .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  #save-state.saving .dot { background: #d99a2b; }
  #save-state.saved .dot { background: var(--teal); }
  #save-state.error .dot { background: var(--danger); }
  .hintbar {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(25,28,38,.88); color: #fff; font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; box-shadow: var(--shadow-md);
    pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 5;
  }
  .hintbar.show { opacity: 1; }
  #loading-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #e9ebf2; z-index: 4; transition: opacity .25s;
  }
  .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .devicebtns { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
  .devicebtns button { border: none; background: var(--panel); padding: 7px 11px; cursor: pointer; color: var(--muted); display: flex; }
  .devicebtns button.active { background: var(--accent-soft); color: var(--accent-strong); }
</style>
</head>
<body>
<div class="editor-wrap">
  <div class="topbar">
    <a href="/cms/" class="btn small ghost">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Dashboard
    </a>
    <span class="logo-kitset" style="color:#14315c">
      <svg class="mark" width="17" height="17" viewBox="0 0 20 20" fill="none"><rect x="1.5" y="1.5" width="17" height="17" stroke="currentColor" stroke-width="2" stroke-dasharray="3.4 2.6"/><rect x="6" y="6" width="8" height="8" fill="currentColor"/></svg>
      <span class="word" style="font-size:13px">KITSET</span>
    </span>
    <span id="site-name" class="muted" style="font-size:13.5px"></span>
    <span class="spacer"></span>
    <span id="save-state" class="muted"><span class="dot"></span><span id="save-text">Loading…</span></span>
    <div class="devicebtns">
      <button id="dev-desktop" class="active" title="Desktop view" aria-label="Desktop view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button id="dev-mobile" title="Mobile view" aria-label="Mobile view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      </button>
    </div>
    <button id="discard" class="btn small ghost danger" hidden>Discard changes</button>
    <button id="publish" class="btn primary" disabled>Publish</button>
  </div>
  <div class="stage" id="stage">
    <div id="loading-overlay"><div class="spinner"></div></div>
    <div id="hintbar" class="hintbar"></div>
    <iframe id="frame" title="Site editor"></iframe>
  </div>
</div>
<input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<div id="toast" class="toast"></div>

<script>
(function () {
  var $ = cms.$, sb = cms.sb;
  var slug = new URLSearchParams(location.search).get('site') || '';
  var draft = {};
  var dirty = false;
  var unpublished = false;
  var saveTimer = null;
  var pickKey = null;
  var toastTimer;

  if (!/^[a-z0-9-]+$/.test(slug)) { location.href = '/cms/'; return; }

  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }
  function setState(cls, text) {
    $('#save-state').className = cls || 'muted';
    $('#save-text').textContent = text;
  }
  function hint(text, ms) {
    var el = $('#hintbar');
    el.textContent = text;
    el.classList.add('show');
    if (ms) setTimeout(function () { el.classList.remove('show'); }, ms);
  }

  async function boot() {
    var s = await cms.requireAuth();
    if (!s) return;
    var me = await cms.whoami();
    var found = me.sites.filter(function (x) { return x.slug === slug; })[0];
    if (!found && !me.isAdmin) { location.href = '/cms/'; return; }
    $('#site-name').textContent = '/ ' + ((found && found.name) || slug);

    var r = await sb.from('drafts').select('content').eq('site_slug', slug).maybeSingle();
    draft = (r.data && r.data.content) || {};
    unpublished = Object.keys(draft).length > 0;
    updateButtons();

    $('#frame').src = '/sites/' + slug + '/?cms-edit=1';
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.type) return;
    var msg = e.data;
    if (msg.type === 'cms-ready') {
      $('#loading-overlay').style.opacity = '0';
      setTimeout(function () { $('#loading-overlay').hidden = true; }, 260);
      if (Object.keys(draft).length) {
        $('#frame').contentWindow.postMessage({ type: 'cms-apply', patch: draft }, location.origin);
        setState('muted', 'Draft restored');
        hint('Your unpublished draft was restored — press Publish when ready', 4200);
      } else {
        setState('muted', 'No changes yet');
        hint('Click any text or photo on the page to edit it', 4200);
      }
    } else if (msg.type === 'cms-patch') {
      draft[msg.key] = { kind: msg.kind, value: msg.value };
      scheduleSave();
    } else if (msg.type === 'cms-pick-image') {
      pickKey = msg.key;
      $('#file-input').click();
    }
  });

  function scheduleSave() {
    dirty = true;
    unpublished = true;
    updateButtons();
    setState('saving', 'Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 900);
  }

  async function saveDraft() {
    var r = await sb.from('drafts').upsert({
      site_slug: slug,
      content: draft,
      updated_at: new Date().toISOString()
    });
    if (r.error) setState('error', 'Draft not saved: ' + r.error.message);
    else { dirty = false; setState('saved', 'Draft saved'); }
  }

  function updateButtons() {
    $('#publish').disabled = !unpublished;
    $('#discard').hidden = !unpublished;
  }

  // ---- images ----
  $('#file-input').addEventListener('change', async function () {
    var file = this.files[0];
    this.value = '';
    if (!file || !pickKey) return;
    var key = pickKey;
    pickKey = null;
    setState('saving', 'Uploading photo…');
    try {
      var resized = await cms.downscale(file, 1920);
      var res = await cms.api('cms-upload', { site: slug, ext: resized.ext, data: resized.base64 });
      $('#frame').contentWindow.postMessage({ type: 'cms-set-image', key: key, src: res.path }, location.origin);
      draft[key] = { kind: 'img', value: res.path };
      scheduleSave();
      toast('Photo updated — press Publish to make it live');
    } catch (e) {
      setState('error', 'Upload failed: ' + e.message);
    }
  });

  // ---- publish: commit, then wait until the change is actually live ----
  $('#publish').addEventListener('click', async function () {
    var keys = Object.keys(draft);
    if (!keys.length) return;
    $('#publish').disabled = true;
    $('#discard').hidden = true;
    setState('saving', 'Publishing…');
    try {
      if (dirty) await saveDraft();
      await cms.api('cms-publish', { site: slug, patch: draft });
      setState('saving', 'Deploying — usually under a minute…');
      var probe = null;
      for (var i = 0; i < keys.length; i++) {
        var p = draft[keys[i]];
        if (p.kind === 'text' && p.value && p.value.length > 3 && p.value.indexOf('\n') === -1) { probe = p.value; break; }
        if (p.kind === 'img') { probe = p.value; break; }
      }
      var live = await waitForLive(probe);
      unpublished = false;
      updateButtons();
      if (live) {
        setState('saved', 'Published — your changes are live');
        toast('Your changes are live');
      } else {
        setState('saved', 'Published — going live shortly');
      }
    } catch (e) {
      setState('error', 'Publish failed: ' + e.message);
      updateButtons();
    }
  });

  function waitForLive(probe) {
    if (!probe) return Promise.resolve(false);
    var esc = probe.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var until = Date.now() + 150000;
    return new Promise(function (resolve) {
      (function check() {
        if (Date.now() > until) { resolve(false); return; }
        fetch('/sites/' + slug + '/index.html', { cache: 'no-store' })
          .then(function (r) { return r.text(); })
          .then(function (html) {
            if (html.indexOf(probe) !== -1 || html.indexOf(esc) !== -1) resolve(true);
            else setTimeout(check, 8000);
          })
          .catch(function () { setTimeout(check, 8000); });
      })();
    });
  }

  // ---- discard ----
  $('#discard').addEventListener('click', async function () {
    if (!confirm('Throw away all unpublished changes and go back to the live version?')) return;
    await sb.from('drafts').delete().eq('site_slug', slug);
    draft = {};
    dirty = false;
    unpublished = false;
    location.reload();
  });

  // ---- device toggle ----
  $('#dev-desktop').addEventListener('click', function () { setDevice(false); });
  $('#dev-mobile').addEventListener('click', function () { setDevice(true); });
  function setDevice(mobile) {
    $('#stage').classList.toggle('mobile', mobile);
    $('#dev-desktop').classList.toggle('active', !mobile);
    $('#dev-mobile').classList.toggle('active', mobile);
  }

  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  boot();
})();
</script>
</body>
</html>
