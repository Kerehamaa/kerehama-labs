<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor — Kitset</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/cms/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cms/cms.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/cms/cms.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  .editor-wrap { display: flex; flex-direction: column; height: 100vh; }
  .stage { flex: 1; background: #dfe7f2; display: flex; justify-content: center; overflow: auto; position: relative; }
  .stage iframe { border: none; background: #fff; width: 100%; height: 100%; }
  .stage.mobile { padding: 18px 0; }
  .stage.mobile iframe {
    width: 390px; height: calc(100% - 0px); margin: 0 auto;
    border-radius: 18px; box-shadow: var(--shadow-lg); border: 1px solid var(--line-strong);
  }
  #save-state { font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
  #save-state .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  #save-state.saving .dot { background: #d99a2b; }
  #save-state.saved .dot { background: var(--teal); }
  #save-state.error .dot { background: var(--danger); }
  .hintbar {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(25,28,38,.88); color: #fff; font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; box-shadow: var(--shadow-md);
    pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 5;
  }
  .hintbar.show { opacity: 1; }
  #loading-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #e9ebf2; z-index: 4; transition: opacity .25s;
  }
  .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .devicebtns { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
  .devicebtns button { border: none; background: var(--panel); padding: 7px 11px; cursor: pointer; color: var(--muted); display: flex; }
  .devicebtns button.active { background: var(--accent-soft); color: var(--accent-strong); }
</style>
</head>
<body>
<div class="editor-wrap">
  <div class="topbar">
    <a href="/cms/" class="btn small ghost">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Dashboard
    </a>
    <span class="logo-kitset" style="color:#14315c">
      <svg class="mark" width="17" height="17" viewBox="0 0 20 20" fill="none"><rect x="1.5" y="1.5" width="17" height="17" stroke="currentColor" stroke-width="2" stroke-dasharray="3.4 2.6"/><rect x="6" y="6" width="8" height="8" fill="currentColor"/></svg>
      <span class="word" style="font-size:13px">KITSET</span>
    </span>
    <span id="site-name" class="muted" style="font-size:13.5px"></span>
    <select id="page-sel" title="Page" style="border:1px solid var(--line-strong);border-radius:7px;padding:6px 9px;font:600 13px var(--font-body);background:var(--panel);color:var(--text);max-width:170px"></select>
    <span class="spacer"></span>
    <span id="save-state" class="muted"><span class="dot"></span><span id="save-text">Loading…</span></span>
    <div class="devicebtns">
      <button id="dev-desktop" class="active" title="Desktop view" aria-label="Desktop view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button id="dev-mobile" title="Mobile view" aria-label="Mobile view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      </button>
    </div>
    <button id="share-preview" class="btn small ghost" title="Copy a link that shows this draft to anyone">Share preview</button>
    <button id="discard" class="btn small ghost danger" hidden>Discard changes</button>
    <button id="schedule-btn" class="btn small" disabled title="Publish this page later">Schedule</button>
    <button id="publish" class="btn primary" disabled>Publish</button>
  </div>
  <div id="sched-pop" hidden style="position:absolute;right:16px;top:56px;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:16px;width:280px">
    <div style="font-weight:600;margin-bottom:8px">Publish this page at…</div>
    <input id="sched-time" type="datetime-local" style="width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:8px;font:inherit;margin-bottom:10px">
    <div style="display:flex;gap:8px">
      <button id="sched-set" class="btn primary small">Schedule</button>
      <button id="sched-close" class="btn small ghost">Cancel</button>
    </div>
    <div id="sched-current" class="hint" style="margin-top:10px"></div>
  </div>
  <div class="stage" id="stage">
    <div id="loading-overlay"><div class="spinner"></div></div>
    <div id="hintbar" class="hintbar"></div>
    <iframe id="frame" title="Site editor"></iframe>
  </div>
</div>
<input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<div id="toast" class="toast"></div>

<script>
(function () {
  var $ = cms.$, sb = cms.sb;
  var slug = new URLSearchParams(location.search).get('site') || '';
  var page = 'index.html';
  var pages = ['index.html'];
  var drafts = { pages: {} };   // { pages: { 'index.html': { key: {kind, value} } } }
  var dirty = false;
  var saveTimer = null;
  var pickKey = null;
  var toastTimer;

  if (!/^[a-z0-9-]+$/.test(slug)) { location.href = '/cms/'; return; }

  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }
  function setState(cls, text) {
    $('#save-state').className = cls || 'muted';
    $('#save-text').textContent = text;
  }
  function hint(text, ms) {
    var el = $('#hintbar');
    el.textContent = text;
    el.classList.add('show');
    if (ms) setTimeout(function () { el.classList.remove('show'); }, ms);
  }

  function pagePatch() {
    if (!drafts.pages[page]) drafts.pages[page] = {};
    return drafts.pages[page];
  }
  function pageLabel(p) {
    if (p === 'index.html') return 'Home';
    return p.replace(/\.html$/, '').replace(/[-_]/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function pageUrl() {
    return '/sites/' + slug + '/' + (page === 'index.html' ? '' : page) + '?cms-edit=1';
  }
  function renderPageSel() {
    $('#page-sel').innerHTML = pages.map(function (p) {
      var pending = drafts.pages[p] && Object.keys(drafts.pages[p]).length;
      return '<option value="' + p + '"' + (p === page ? ' selected' : '') + '>' +
        pageLabel(p) + (pending ? ' •' : '') + '</option>';
    }).join('');
    $('#page-sel').hidden = pages.length < 2;
  }
  function updateButtons() {
    var pending = Object.keys(pagePatch()).length > 0;
    $('#publish').disabled = !pending;
    $('#schedule-btn').disabled = !pending && !schedRow;
    $('#discard').hidden = !pending;
    renderPageSel();
  }
  var schedRow = null;
  async function loadSchedule() {
    var r = await sb.from('scheduled_publishes').select('id,run_at')
      .eq('site_slug', slug).eq('page', page).eq('status', 'open')
      .order('run_at').limit(1).maybeSingle();
    schedRow = r.data || null;
    renderSchedule();
  }
  function renderSchedule() {
    var el = $('#sched-current');
    if (schedRow) {
      var when = new Date(schedRow.run_at).toLocaleString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
      el.innerHTML = 'Scheduled for <b>' + when + '</b> <button id="sched-cancel" class="btn small ghost danger" style="margin-left:6px">Cancel it</button>';
      var cb = document.getElementById('sched-cancel');
      if (cb) cb.addEventListener('click', async function () {
        await sb.from('scheduled_publishes').update({ status: 'canceled' }).eq('id', schedRow.id);
        schedRow = null;
        renderSchedule();
        toast('Scheduled publish canceled');
      });
      $('#schedule-btn').textContent = 'Scheduled';
    } else {
      el.textContent = '';
      $('#schedule-btn').textContent = 'Schedule';
    }
  }

  $('#schedule-btn').addEventListener('click', function () {
    var pop = $('#sched-pop');
    pop.hidden = !pop.hidden;
    if (!pop.hidden) {
      var d = new Date(Date.now() + 3600e3);
      d.setMinutes(0, 0, 0);
      var pad = function (n) { return String(n).padStart(2, '0'); };
      $('#sched-time').value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      renderSchedule();
    }
  });
  $('#sched-close').addEventListener('click', function () { $('#sched-pop').hidden = true; });
  $('#sched-set').addEventListener('click', async function () {
    var v = $('#sched-time').value;
    var when = v ? new Date(v) : null;
    if (!when || isNaN(when) || when.getTime() < Date.now() + 60e3) { toast('Pick a time in the future'); return; }
    if (!Object.keys(pagePatch()).length) { toast('Make some changes first — the draft is what gets published'); return; }
    if (dirty) await saveDraft();
    var session = await cms.session();
    var r = await sb.from('scheduled_publishes').insert({
      site_slug: slug, page: page, run_at: when.toISOString(), created_by: session.user.id
    });
    if (r.error) { toast('Could not schedule: ' + r.error.message); return; }
    $('#sched-pop').hidden = true;
    toast('Scheduled — your draft goes live automatically');
    loadSchedule();
  });

  $('#share-preview').addEventListener('click', async function () {
    if (!drafts._preview || !drafts._preview.token) {
      var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      var tok = Array.from(crypto.getRandomValues(new Uint8Array(24)), function (b) { return chars[b % chars.length]; }).join('');
      drafts._preview = { token: tok };
      await saveDraft();
    }
    var url = location.origin + '/api/cms-preview?site=' + encodeURIComponent(slug) + '&page=' + encodeURIComponent(page) + '&t=' + drafts._preview.token;
    navigator.clipboard.writeText(url).then(function () {
      toast('Preview link copied — anyone with it can see this draft');
    }, function () {
      window.prompt('Copy the preview link:', url);
    });
  });

  function loadFrame() {
    $('#loading-overlay').hidden = false;
    $('#loading-overlay').style.opacity = '1';
    $('#frame').src = pageUrl();
  }

  async function boot() {
    var s = await cms.requireAuth();
    if (!s) return;
    var me = await cms.whoami();
    var found = me.sites.filter(function (x) { return x.slug === slug; })[0];
    if (!found && !me.isAdmin) { location.href = '/cms/'; return; }
    $('#site-name').textContent = '/ ' + ((found && found.name) || slug);

    try {
      var pr = await cms.api('cms-pages', { site: slug });
      if (pr.pages && pr.pages.length) pages = pr.pages;
    } catch (e) { /* fall back to index.html only */ }

    var r = await sb.from('drafts').select('content').eq('site_slug', slug).maybeSingle();
    var content = (r.data && r.data.content) || {};
    drafts = content.pages ? content : { pages: (Object.keys(content).length ? { 'index.html': content } : {}) };
    updateButtons();
    loadFrame();
    loadSchedule();
  }

  $('#page-sel').addEventListener('change', function () {
    page = this.value;
    updateButtons();
    loadFrame();
    loadSchedule();
  });

  // ---- messages from the iframe runtime ----
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.type) return;
    var msg = e.data;
    if (msg.type === 'cms-ready') {
      $('#loading-overlay').style.opacity = '0';
      setTimeout(function () { $('#loading-overlay').hidden = true; }, 260);
      var patch = pagePatch();
      if (Object.keys(patch).length) {
        $('#frame').contentWindow.postMessage({ type: 'cms-apply', patch: patch }, location.origin);
        setState('muted', 'Draft restored');
        hint('Your unpublished draft was restored — press Publish when ready', 4200);
      } else {
        setState('muted', 'No changes yet');
        hint('Click any text or photo on the page to edit it', 4200);
      }
    } else if (msg.type === 'cms-patch') {
      pagePatch()[msg.key] = { kind: msg.kind, value: msg.value };
      scheduleSave();
    } else if (msg.type === 'cms-pick-image') {
      pickKey = msg.key;
      $('#file-input').click();
    }
  });

  // ---- draft autosave ----
  function scheduleSave() {
    dirty = true;
    updateButtons();
    setState('saving', 'Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 900);
  }

  async function saveDraft() {
    var r = await sb.from('drafts').upsert({
      site_slug: slug,
      content: drafts,
      updated_at: new Date().toISOString()
    });
    if (r.error) setState('error', 'Draft not saved: ' + r.error.message);
    else { dirty = false; setState('saved', 'Draft saved'); }
  }

  // ---- image replacement ----
  $('#file-input').addEventListener('change', async function () {
    var file = this.files[0];
    this.value = '';
    if (!file || !pickKey) return;
    var key = pickKey;
    pickKey = null;
    setState('saving', 'Uploading photo…');
    try {
      var resized = await cms.downscale(file, 1920);
      var res = await cms.api('cms-upload', { site: slug, ext: resized.ext, data: resized.base64 });
      $('#frame').contentWindow.postMessage({ type: 'cms-set-image', key: key, src: res.path }, location.origin);
      pagePatch()[key] = { kind: 'img', value: res.path };
      scheduleSave();
      toast('Photo updated — press Publish to make it live');
    } catch (e) {
      setState('error', 'Upload failed: ' + e.message);
    }
  });

  // ---- publish this page, then wait until the change is actually live ----
  $('#publish').addEventListener('click', async function () {
    var patch = pagePatch();
    var keys = Object.keys(patch);
    if (!keys.length) return;
    $('#publish').disabled = true;
    $('#discard').hidden = true;
    setState('saving', 'Publishing…');
    try {
      var payload = JSON.parse(JSON.stringify(patch));
      await cms.api('cms-publish', { site: slug, page: page, patch: payload });
      setState('saving', 'Deploying — usually under a minute…');
      var probe = null;
      for (var i = 0; i < keys.length; i++) {
        var p = payload[keys[i]];
        if (p.kind === 'text' && p.value && p.value.length > 3 && p.value.indexOf('<') === -1) { probe = p.value; break; }
        if (p.kind === 'img') { probe = p.value; break; }
      }
      var live = await waitForLive(probe);
      delete drafts.pages[page];
      await saveDraft();
      updateButtons();
      setState('saved', live ? 'Published — your changes are live' : 'Published — going live shortly');
      if (live) toast('Your changes are live');
    } catch (e) {
      setState('error', 'Publish failed: ' + e.message);
      updateButtons();
    }
  });

  function waitForLive(probe) {
    if (!probe) return Promise.resolve(false);
    var esc = probe.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var until = Date.now() + 150000;
    var path = '/sites/' + slug + '/' + page;
    return new Promise(function (resolve) {
      (function check() {
        if (Date.now() > until) { resolve(false); return; }
        fetch(path, { cache: 'no-store' })
          .then(function (r) { return r.text(); })
          .then(function (html) {
            if (html.indexOf(probe) !== -1 || html.indexOf(esc) !== -1) resolve(true);
            else setTimeout(check, 8000);
          })
          .catch(function () { setTimeout(check, 8000); });
      })();
    });
  }

  // ---- discard this page's changes ----
  $('#discard').addEventListener('click', async function () {
    if (!confirm('Throw away the unpublished changes on this page and go back to the live version?')) return;
    delete drafts.pages[page];
    await saveDraft();
    updateButtons();
    loadFrame();
  });

  // ---- device toggle ----
  $('#dev-desktop').addEventListener('click', function () { setDevice(false); });
  $('#dev-mobile').addEventListener('click', function () { setDevice(true); });
  function setDevice(mobile) {
    $('#stage').classList.toggle('mobile', mobile);
    $('#dev-desktop').classList.toggle('active', !mobile);
    $('#dev-mobile').classList.toggle('active', mobile);
  }

  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  boot();
})();
</script>
</body>
</html>
